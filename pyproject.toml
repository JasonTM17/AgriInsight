[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agriinsight"
version = "0.2.0"
description = "Deterministic Bronze-Silver-Gold agriculture analytics pipeline with quality gates, star-schema and Gold KPI contracts."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.41,<1",
]
dashboard = [
  "plotly>=6,<7",
  "streamlit>=1.58,<2",
]
reports = [
  "reportlab>=4.4,<6",
]
dev = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "pytest>=8,<10",
  "uvicorn>=0.41,<1",
]

[project.scripts]
agriinsight = "agriinsight.__main__:main"
agriinsight-analytics = "agriinsight.analytics_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agriinsight = [
  "*.sql",
  "report-assets/*.mjs",
  "report-assets/fonts/*.md",
  "report-assets/fonts/*.ttf",
  "report-assets/fonts/*.txt",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
