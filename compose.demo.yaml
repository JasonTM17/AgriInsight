name: agriinsight-demo

services:
  postgres:
    command:
      - postgres
      - -c
      - app.agriinsight_demo_database=true
    labels:
      com.agriinsight.environment: local-demo
    environment:
      POSTGRES_DB: agriinsight_demo
    volumes:
      - ${AGRIINSIGHT_DEMO_POSTGRES_DATA_DIR:-./backend/.runtime/postgres-demo}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - psql -U postgres -d agriinsight_demo -tAc 'SELECT 1' | grep -qx 1
      start_period: 30s

  backend-role-bootstrap:
    environment:
      PGDATABASE: agriinsight_demo

  backend-migrate:
    environment:
      AGRIINSIGHT_DB_URL: jdbc:postgresql://postgres:5432/agriinsight_demo
      AGRIINSIGHT_FLYWAY_URL: jdbc:postgresql://postgres:5432/agriinsight_demo

  backend:
    environment:
      AGRIINSIGHT_DB_URL: jdbc:postgresql://postgres:5432/agriinsight_demo
