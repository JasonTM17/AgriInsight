<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title description">
  <title id="title">AgriInsight inventory demand forecast architecture</title>
  <desc id="description">Verified warehouse movements flow through a deterministic backtested forecast and checksummed Gold contracts, then through scoped FastAPI and Next BFF boundaries to a Vietnamese evidence panel. The browser does not calculate forecasts and the system does not create purchase orders automatically.</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
    }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13px; }
    .layer-label { fill: #4b5563; font-size: 11px; font-weight: 700; letter-spacing: 0.11em; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-copy { fill: #4b5563; font-size: 12px; }
    .node-code { fill: #374151; font-family: Consolas, "Courier New", monospace; font-size: 11px; }
    .arrow-label { fill: #374151; font-size: 11px; font-weight: 600; }
    .legend { fill: #4b5563; font-size: 11px; }
    .boundary { fill: #7c2d12; font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">Inventory demand forecast — verified evidence flow</text>
  <text x="48" y="72" class="subtitle">Deterministic 30-day baseline · rolling-origin backtest · scoped delivery · fail-closed contracts</text>

  <rect x="40" y="100" width="1120" height="230" rx="12" fill="#f0fdf4" fill-opacity="0.52" stroke="#86efac" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="58" y="124" class="layer-label">DATA PRODUCT LAYER</text>

  <g filter="url(#soft-shadow)">
    <rect x="76" y="151" width="220" height="126" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="96" y="170" width="38" height="38" rx="8" fill="#ccfbf1"/>
    <path d="M106 190h18M109 181v18M121 181v18" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
    <text x="146" y="183" class="node-title">Warehouse movement facts</text>
    <text x="146" y="202" class="node-code">warehouse × material</text>
    <text x="96" y="231" class="node-copy">Validated OUT quantities</text>
    <text x="96" y="250" class="node-copy">As-of bounded · base-unit safe</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="362" y="143" width="242" height="142" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="382" y="164" width="40" height="40" rx="20" fill="#ede9fe"/>
    <path d="M392 186l7-13 2 10h10l-12 15 2-12z" fill="#7c3aed"/>
    <text x="435" y="179" class="node-title">Baseline + backtest</text>
    <text x="435" y="198" class="node-code">baseline-mean-v1</text>
    <text x="382" y="228" class="node-copy">90-day mean · 30-day horizon</text>
    <text x="382" y="247" class="node-copy">Empirical p10/p90 range</text>
    <text x="382" y="266" class="node-copy">Weekly MAE/WAPE windows</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="684" y="143" width="252" height="142" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <ellipse cx="716" cy="173" rx="19" ry="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <path d="M697 173v28M735 173v28" stroke="#2563eb" stroke-width="1.4"/>
    <ellipse cx="716" cy="201" rx="19" ry="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="750" y="179" class="node-title">Checksummed Gold</text>
    <text x="750" y="198" class="node-code">inventory_demand_forecast.csv</text>
    <text x="704" y="228" class="node-copy">One-to-one inventory status join</text>
    <text x="704" y="247" class="node-copy">Manifest row count + SHA-256</text>
    <text x="704" y="266" class="node-copy">Explicit coverage states</text>
  </g>

  <path d="M296 214H352" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/>
  <rect x="303" y="194" width="43" height="17" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="324.5" y="206" text-anchor="middle" class="arrow-label">dense</text>
  <path d="M604 214H674" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/>
  <rect x="614" y="194" width="50" height="17" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="639" y="206" text-anchor="middle" class="arrow-label">publish</text>

  <rect x="40" y="365" width="1120" height="246" rx="12" fill="#eff6ff" fill-opacity="0.45" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="58" y="389" class="layer-label">AUTHORIZED DELIVERY LAYER</text>

  <g filter="url(#soft-shadow)">
    <rect x="76" y="432" width="212" height="122" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <polygon points="110,452 126,461 126,479 110,488 94,479 94,461" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
    <path d="M103 470l5 5 10-12" fill="none" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="465" class="node-title">Spring-resolved scope</text>
    <text x="96" y="501" class="node-copy">Tenant · roles · warehouse</text>
    <text x="96" y="520" class="node-copy">Server session; client cannot choose</text>
    <text x="96" y="539" class="node-copy">scope or model</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="354" y="416" width="274" height="154" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="391,441 410,452 410,474 391,485 372,474 372,452" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="391" y="467" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="700">API</text>
    <text x="425" y="457" class="node-title">FastAPI analytics boundary</text>
    <text x="374" y="508" class="node-copy">1. authorize + warehouse filter</text>
    <text x="374" y="527" class="node-copy">2. verify snapshot + reconciliation</text>
    <text x="374" y="546" class="node-copy">3. nest evidence + cap final JSON at 1 MiB</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="700" y="432" width="182" height="122" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="720" y="452" width="36" height="36" rx="7" fill="#ede9fe"/>
    <path d="M729 463h18M729 470h18M729 477h12" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <text x="770" y="466" class="node-title">Next BFF</text>
    <text x="720" y="508" class="node-copy">Same-origin allowlist</text>
    <text x="720" y="527" class="node-copy">Bearer stays server-side</text>
    <text x="720" y="546" class="node-copy">Bounded response forwarding</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="936" y="416" width="196" height="154" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="956" y="439" width="42" height="34" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
    <rect x="956" y="439" width="42" height="9" rx="5" fill="#ccfbf1"/>
    <circle cx="963" cy="443.5" r="1.8" fill="#ef4444"/>
    <circle cx="969" cy="443.5" r="1.8" fill="#f59e0b"/>
    <circle cx="975" cy="443.5" r="1.8" fill="#10b981"/>
    <text x="1010" y="457" class="node-title">Evidence panel</text>
    <text x="956" y="503" class="node-copy">Vietnamese status + freshness</text>
    <text x="956" y="522" class="node-copy">Point/range/model/backtest</text>
    <text x="956" y="541" class="node-copy">Responsive + accessible table</text>
  </g>

  <path d="M288 493H344" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="294" y="472" width="45" height="17" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="316.5" y="484" text-anchor="middle" class="arrow-label">scope</text>

  <path d="M810 285V344H491V406" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/>
  <rect x="603" y="334" width="96" height="18" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="651" y="347" text-anchor="middle" class="arrow-label">verified snapshot</text>

  <path d="M628 493H690" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <rect x="637" y="472" width="44" height="17" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="659" y="484" text-anchor="middle" class="arrow-label">JSON</text>
  <path d="M882 493H926" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <rect x="889" y="472" width="31" height="17" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="904.5" y="484" text-anchor="middle" class="arrow-label">UI</text>

  <rect x="40" y="635" width="1120" height="76" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="60" y="660" class="boundary">Decision-support boundary</text>
  <text x="60" y="682" class="subtitle">No browser forecast math · no automatic purchase order · unavailable evidence stays explicitly null · candidate images are not production deployment</text>

  <g transform="translate(710 650)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#16a34a" stroke-width="2.1" marker-end="url(#arrow-green)"/>
    <text x="39" y="12" class="legend">data transform</text>
    <line x1="145" y1="8" x2="175" y2="8" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="184" y="12" class="legend">scope control</text>
    <line x1="285" y1="8" x2="315" y2="8" stroke="#2563eb" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
    <text x="324" y="12" class="legend">authorized delivery</text>
  </g>
  <text x="1158" y="742" text-anchor="end" class="legend">Source: accepted AgriInsight forecast contracts and Phase 3 delivery path · 2026-07-29</text>
</svg>
