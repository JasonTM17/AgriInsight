name: Publish release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: release-images
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: python
            context: .
            file: ./Dockerfile
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: web
            context: .
            file: ./deploy/docker/web.Dockerfile
          - name: analytics-api
            context: .
            file: ./deploy/docker/analytics-api.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable release coordinates
        id: refs
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$DOCKERHUB_NAMESPACE"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dockerhub=$DOCKERHUB_NAMESPACE/agriinsight-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/$owner/agriinsight-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Derive immutable tags and OCI labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.refs.outputs.dockerhub }}
            ${{ steps.refs.outputs.ghcr }}
          tags: |
            type=raw,value=${{ steps.refs.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.refs.outputs.version }}

      - name: Build the local release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: agriinsight-${{ matrix.name }}:release-candidate-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.refs.outputs.version }}

      - name: Scan the candidate before registry authentication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agriinsight-${{ matrix.name }}:release-candidate-${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke-test the local candidate as non-root and read-only
        shell: pwsh
        run: >-
          ./scripts/smoke-image-digest.ps1
          -Image 'agriinsight-${{ matrix.name }}:release-candidate-${{ github.sha }}'
          -Kind '${{ matrix.name }}'

      - name: Authenticate to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build, attest, and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.refs.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Verify published provenance and SBOM attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.refs.outputs.ghcr }}
        run: |
          set -euo pipefail
          provenance="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Provenance}}')"
          sbom="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}')"
          test -n "$provenance"
          test "$provenance" != "null"
          test -n "$sbom"
          test "$sbom" != "null"

      - name: Scan the exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.ghcr }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Pull the exact published digest before smoke test
        run: |
          set -euo pipefail
          docker pull "${{ steps.refs.outputs.ghcr }}@${{ steps.build.outputs.digest }}"

      - name: Smoke-test the exact published digest
        shell: pwsh
        run: >-
          ./scripts/smoke-image-digest.ps1
          -Image '${{ steps.refs.outputs.ghcr }}@${{ steps.build.outputs.digest }}'
          -Kind '${{ matrix.name }}'

      - name: Verify both registry tags resolve to the returned digest
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.refs.outputs.version }}
          DOCKERHUB_IMAGE: ${{ steps.refs.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.refs.outputs.ghcr }}
        run: |
          set -euo pipefail
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            actual="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "$actual" = "$EXPECTED_DIGEST"
          done
