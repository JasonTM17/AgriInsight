name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install ".[dev,dashboard,reports]"
      - run: python -m pip check
      - run: python -m pytest
      - run: node --check src/agriinsight/report-assets/build-cost-report.mjs
      - name: Smoke-test installed wheel report assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel"
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-install" "$RUNNER_TEMP"/wheel/agriinsight-*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-install" python - <<'PY'
          from agriinsight.cost_report_assets import bundled_font_dir, bundled_xlsx_builder

          font_dir = bundled_font_dir()
          assert (font_dir / "NotoSans-Regular.ttf").is_file()
          assert (font_dir / "NotoSans-Bold.ttf").is_file()
          assert (font_dir / "OFL.txt").is_file()
          assert bundled_xlsx_builder().is_file()
          PY
      - run: python -m agriinsight run --output artifacts --farms 2 --fields-per-farm 2 --activities-per-season 6
      - run: python -m compileall -q src dashboard tests

  backend:
    name: Java backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Prepare migration fixture workspace
        run: mkdir -p artifacts/_tmp
      - name: Verify unit, integration, RLS, and OpenAPI contracts
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  web:
    name: Next web foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact web dependency graph
        run: npm --prefix web ci --ignore-scripts
      - name: Verify generated OpenAPI types
        run: npm --prefix web run contracts:check
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
      - name: Audit production web dependencies
        run: npm --prefix web run audit:prod

  security:
    name: Dependency, configuration, and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-files: backend/src/test/java/com/agriinsight/backend/shared/config/ConfigurationSafetyTest.java

  realtime-e2e:
    name: Real PostgreSQL and Kafka outbox gate
    needs: [backend, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Prepare Maven wrapper
        run: chmod +x backend/mvnw
      - name: Run real PostgreSQL, Apache Kafka, recovery, replay, DLT, and RLS gate
        shell: pwsh
        run: |
          # setup-java v5 exports MAVEN_ARGS; this runner accepts only reviewed explicit arguments.
          if ($env:MAVEN_ARGS -cne "-ntp") {
            throw "setup-java v5 must export exactly MAVEN_ARGS=-ntp before realtime E2E."
          }
          Remove-Item -Path Env:MAVEN_ARGS
          ./scripts/run-realtime-e2e-tests.ps1 -HostedCi
      - name: Upload safe recovery drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-drill-${{ github.sha }}
          path: |
            artifacts/recovery-evidence/**/*.metadata.json
            artifacts/recovery-evidence/**/*.restore-*.json
            artifacts/recovery-evidence/**/summary.json
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    name: Real seven-persona browser gate
    needs: [python, backend, web, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL and media clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick postgresql-client
      - name: Install analytics and browser dependencies
        run: |
          python -m pip install ".[dev,dashboard,reports]"
          npm --prefix web ci --ignore-scripts
          npm --prefix web exec -- playwright install --with-deps chrome
      - name: Generate verified 1.05M-reading corpus
        shell: pwsh
        run: |
          ./scripts/check-hosted-ci-disk.ps1 -Path $env:RUNNER_TEMP
          python -m agriinsight run --profile big-data --output artifacts/big-data
      - name: Run real Keycloak, PostgreSQL, Spring, analytics and Chrome gate
        shell: pwsh
        run: |
          ./scripts/run-web-e2e-tests.ps1 -HostedCi -CaptureMedia
      - name: Build verified documentation media
        shell: pwsh
        run: ./scripts/build-demo-media.ps1
      - name: Upload complete portfolio media evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-media-${{ github.sha }}
          path: |
            artifacts/media-capture/screens/overview-dashboard-desktop.png
            artifacts/media-capture/screens/overview-dashboard-mobile.png
            artifacts/media-capture/screens/work-operations-desktop.png
            artifacts/media-capture/screens/work-operations-mobile.png
            artifacts/media-capture/screens/cost-analysis-desktop.png
            artifacts/media-capture/screens/cost-analysis-mobile.png
            artifacts/media-capture/screens/crop-health-desktop.png
            artifacts/media-capture/screens/crop-health-mobile.png
            artifacts/media-capture/screens/data-quality-desktop.png
            artifacts/media-capture/screens/data-quality-mobile.png
            artifacts/media-capture/screens/assistant-evidence-first-desktop.png
            artifacts/media-capture/screens/assistant-evidence-first-mobile.png
            artifacts/media-capture/screens/tenant-administration-desktop.png
            artifacts/media-capture/screens/tenant-administration-mobile.png
            docs/assets/screens/overview-dashboard-desktop.webp
            docs/assets/screens/overview-dashboard-mobile.webp
            docs/assets/screens/work-operations-desktop.webp
            docs/assets/screens/work-operations-mobile.webp
            docs/assets/screens/cost-analysis-desktop.webp
            docs/assets/screens/cost-analysis-mobile.webp
            docs/assets/screens/crop-health-desktop.webp
            docs/assets/screens/crop-health-mobile.webp
            docs/assets/screens/data-quality-desktop.webp
            docs/assets/screens/data-quality-mobile.webp
            docs/assets/screens/assistant-evidence-first-desktop.webp
            docs/assets/screens/assistant-evidence-first-mobile.webp
            docs/assets/screens/tenant-administration-desktop.webp
            docs/assets/screens/tenant-administration-mobile.webp
            docs/assets/screens/catalog.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload inventory forecast media evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventory-forecast-media-${{ github.sha }}
          path: |
            artifacts/media-capture/screens/inventory-demand-forecast-desktop.png
            artifacts/media-capture/screens/inventory-demand-forecast-mobile.png
            artifacts/media-capture/frames/forecast-*.png
            docs/assets/screens/inventory-demand-forecast-desktop.webp
            docs/assets/screens/inventory-demand-forecast-mobile.webp
            assets/generated/agriinsight-inventory-forecast-loop.gif
          if-no-files-found: error
          retention-days: 7
      - name: Upload yield forecast media evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yield-forecast-media-${{ github.sha }}
          path: |
            artifacts/media-capture/screens/yield-forecast-desktop.png
            artifacts/media-capture/screens/yield-forecast-mobile.png
            artifacts/media-capture/frames/yield-forecast-*.png
            docs/assets/screens/yield-forecast-desktop.webp
            docs/assets/screens/yield-forecast-mobile.webp
            assets/generated/agriinsight-yield-forecast-loop.gif
            assets/generated/agriinsight-yield-forecast-media-manifest.json
          if-no-files-found: error
          retention-days: 7

  images:
    name: Build ${{ matrix.name }} image without push
    needs: [python, backend, web, security, realtime-e2e, browser-e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            context: .
            file: ./Dockerfile
            tag: agriinsight-python:ci
            version: 0.2.0-ci
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            tag: agriinsight-backend:ci
            version: 0.1.0-ci
          - name: web
            context: .
            file: ./deploy/docker/web.Dockerfile
            tag: agriinsight-web:ci
            version: 0.1.0-ci
          - name: analytics-api
            context: .
            file: ./deploy/docker/analytics-api.Dockerfile
            tag: agriinsight-analytics-api:ci
            version: 0.2.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ matrix.version }}
      - name: Scan the image before any release can publish it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke-test non-root image with a read-only root filesystem
        shell: pwsh
        run: ./scripts/smoke-image-digest.ps1 -Image '${{ matrix.tag }}' -Kind '${{ matrix.name }}'
