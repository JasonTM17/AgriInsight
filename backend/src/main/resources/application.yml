spring:
  application:
    name: agriinsight-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${AGRIINSIGHT_DB_URL:jdbc:postgresql://localhost:5432/agriinsight}
    username: ${AGRIINSIGHT_DB_RUNTIME_USERNAME:agriinsight_runtime}
    password: ${AGRIINSIGHT_DB_RUNTIME_PASSWORD:}
    hikari:
      connection-timeout: ${AGRIINSIGHT_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${AGRIINSIGHT_DB_VALIDATION_TIMEOUT_MS:1000}
      initialization-fail-timeout: ${AGRIINSIGHT_DB_INITIALIZATION_FAIL_TIMEOUT_MS:-1}
      data-source-properties:
        connectTimeout: ${AGRIINSIGHT_DB_CONNECT_TIMEOUT_SECONDS:3}
        loginTimeout: ${AGRIINSIGHT_DB_LOGIN_TIMEOUT_SECONDS:5}
        socketTimeout: ${AGRIINSIGHT_DB_SOCKET_TIMEOUT_SECONDS:5}
        tcpKeepAlive: ${AGRIINSIGHT_DB_TCP_KEEPALIVE:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
      hibernate.jdbc.time_zone: UTC
      jakarta.persistence.database-product-name: PostgreSQL
      jakarta.persistence.database-major-version: 18
      jakarta.persistence.database-minor-version: 0
  flyway:
    enabled: ${AGRIINSIGHT_FLYWAY_ENABLED:false}
    url: ${AGRIINSIGHT_FLYWAY_URL:${AGRIINSIGHT_DB_URL:jdbc:postgresql://localhost:5432/agriinsight}}
    user: ${AGRIINSIGHT_FLYWAY_USERNAME:agriinsight_migrator}
    password: ${AGRIINSIGHT_FLYWAY_PASSWORD:}
    postgresql:
      transactional-lock: false
  kafka:
    bootstrap-servers: ${AGRIINSIGHT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 5
    consumer:
      group-id: ${AGRIINSIGHT_KAFKA_CONSUMER_GROUP:agriinsight-realtime-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        "[max.partition.fetch.bytes]": ${AGRIINSIGHT_REALTIME_MAX_RECORD_BYTES:262144}
    listener:
      ack-mode: record
      missing-topics-fatal: true

server:
  address: ${AGRIINSIGHT_SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,schemaHistory

agriinsight:
  api-docs:
    enabled: ${AGRIINSIGHT_API_DOCS_ENABLED:false}
  migration:
    exit-on-complete: ${AGRIINSIGHT_MIGRATION_EXIT_ON_COMPLETE:false}
  identity:
    enabled: ${AGRIINSIGHT_IDENTITY_ENABLED:false}
    issuer-uri: ${AGRIINSIGHT_OIDC_ISSUER_URI:}
    jwk-set-uri: ${AGRIINSIGHT_OIDC_JWK_SET_URI:}
    api-audience: ${AGRIINSIGHT_OIDC_API_AUDIENCE:}
    interactive-client-id: ${AGRIINSIGHT_OIDC_INTERACTIVE_CLIENT_ID:}
    clock-skew: ${AGRIINSIGHT_OIDC_CLOCK_SKEW:60s}
    jws-algorithm: ${AGRIINSIGHT_OIDC_JWS_ALGORITHM:RS256}
    discriminator-location: ${AGRIINSIGHT_OIDC_DISCRIMINATOR_LOCATION:CLAIM}
    discriminator-name: ${AGRIINSIGHT_OIDC_DISCRIMINATOR_NAME:token_use}
    discriminator-value: ${AGRIINSIGHT_OIDC_DISCRIMINATOR_VALUE:access}
    display-name-claim: ${AGRIINSIGHT_OIDC_DISPLAY_NAME_CLAIM:name}
    email-claim: ${AGRIINSIGHT_OIDC_EMAIL_CLAIM:email}
    assurance-claim: ${AGRIINSIGHT_OIDC_ASSURANCE_CLAIM:acr}
    cors-allowed-origins: ${AGRIINSIGHT_CORS_ALLOWED_ORIGINS:}
  schema:
    expected-version: ${AGRIINSIGHT_SCHEMA_EXPECTED_VERSION:30}
  realtime:
    publisher-enabled: ${AGRIINSIGHT_REALTIME_PUBLISHER_ENABLED:false}
    consumer-enabled: ${AGRIINSIGHT_REALTIME_CONSUMER_ENABLED:false}
    worker-id: ${AGRIINSIGHT_REALTIME_WORKER_ID:realtime-worker-1}
    batch-size: ${AGRIINSIGHT_REALTIME_BATCH_SIZE:20}
    lease-duration: ${AGRIINSIGHT_REALTIME_LEASE_DURATION:30s}
    poll-delay: ${AGRIINSIGHT_REALTIME_POLL_DELAY:1s}
    send-timeout: ${AGRIINSIGHT_REALTIME_SEND_TIMEOUT:20s}
    topic: ${AGRIINSIGHT_REALTIME_TOPIC:agriinsight.operational.v1}
    dead-letter-topic: ${AGRIINSIGHT_REALTIME_DLT_TOPIC:agriinsight.operational.v1.dlt}
    partitions: ${AGRIINSIGHT_REALTIME_PARTITIONS:6}
    replication-factor: ${AGRIINSIGHT_REALTIME_REPLICATION_FACTOR:1}
    max-record-bytes: ${AGRIINSIGHT_REALTIME_MAX_RECORD_BYTES:262144}
    alerts:
      enabled: ${AGRIINSIGHT_REALTIME_ALERTS_ENABLED:false}
      evaluation-delay: ${AGRIINSIGHT_REALTIME_ALERT_EVALUATION_DELAY:30s}
      publish-backlog-threshold: ${AGRIINSIGHT_REALTIME_ALERT_PUBLISH_BACKLOG_THRESHOLD:5m}
      delivery-lag-threshold: ${AGRIINSIGHT_REALTIME_ALERT_DELIVERY_LAG_THRESHOLD:5m}
      healthy-for: ${AGRIINSIGHT_REALTIME_ALERT_HEALTHY_FOR:5m}
      required-clean-scans: ${AGRIINSIGHT_REALTIME_ALERT_REQUIRED_CLEAN_SCANS:2}
      maximum-candidates: ${AGRIINSIGHT_REALTIME_ALERT_MAXIMUM_CANDIDATES:500}
      maximum-query-duration: ${AGRIINSIGHT_REALTIME_ALERT_MAXIMUM_QUERY_DURATION:20s}
      observer-group-id: ${AGRIINSIGHT_REALTIME_ALERT_OBSERVER_GROUP:agriinsight-alert-observer-v1}
      observer-failure-topic: ${AGRIINSIGHT_REALTIME_ALERT_OBSERVER_FAILURE_TOPIC:agriinsight.operational.v1.alert-observer-failure}
      observer-failure-retries: ${AGRIINSIGHT_REALTIME_ALERT_OBSERVER_FAILURE_RETRIES:2}
      observer-retry-interval: ${AGRIINSIGHT_REALTIME_ALERT_OBSERVER_RETRY_INTERVAL:500ms}

springdoc:
  api-docs:
    enabled: ${AGRIINSIGHT_API_DOCS_ENABLED:false}
    version: openapi-3-1
  paths-to-match: /api/v1/**
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  swagger-ui:
    enabled: ${AGRIINSIGHT_API_DOCS_ENABLED:false}
