spring:
  main:
    web-application-type: none
  datasource:
    username: ${AGRIINSIGHT_ALERT_WORKER_DB_USERNAME:agriinsight_alert_worker}
    password: ${AGRIINSIGHT_ALERT_WORKER_DB_PASSWORD:}
    hikari:
      data-source-properties:
        # Must outlive the alert worker's configuration-capped 60-second query timeout.
        socketTimeout: 65

agriinsight:
  realtime:
    publisher-enabled: ${AGRIINSIGHT_REALTIME_PUBLISHER_ENABLED:false}
    consumer-enabled: ${AGRIINSIGHT_REALTIME_CONSUMER_ENABLED:false}
    alerts:
      enabled: ${AGRIINSIGHT_REALTIME_ALERTS_ENABLED:true}
